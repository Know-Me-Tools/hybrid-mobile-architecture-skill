name: production-convergence
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  authority:
    name: Canonical manifests, skills, and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate canonical artifacts
        run: node scripts/ci-package.mjs generate
      - name: Reject generated drift
        run: git diff --exit-code
      - name: Validate package authority
        run: node scripts/ci-package.mjs authority
      - name: Reject tracked runtime exhaust
        run: node scripts/ci-package.mjs exhaust
      - name: Portable runtime language gate
        run: node scripts/check-portable-runtime.mjs
  cli:
    name: CLI and byte-stable profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: tools/knowme-builder
      - name: Rust quality gates
        run: node scripts/ci-package.mjs rust-gates
      - name: Generate runnable profiles twice
        run: node scripts/ci-package.mjs profiles
      - name: Manifest and command contract checks
        run: node scripts/ci-package.mjs manifest
  clean-install:
    name: Git URL discovery and isolated harness install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - authority
      - cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify public and internal discovery counts
        run: node scripts/check-git-url-discovery.mjs
      - name: Verify idempotence, receipts, and safe uninstall
        run: node scripts/test-harness-installer.mjs
