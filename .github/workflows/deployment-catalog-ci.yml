name: Deployment catalog CI
on:
  pull_request:
    paths:
      - deploy/**
      - runtime/**
      - scripts/ci-deployment.mjs
      - .github/workflows/deployment-*.yml
  push:
    branches:
      - main
    paths:
      - deploy/**
      - runtime/**
      - scripts/ci-deployment.mjs
      - .github/workflows/deployment-*.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install validator tools
        env:
          KUSTOMIZE_VERSION: 5.7.1
        run: node scripts/ci-deployment.mjs install-kustomize
      - run: node deploy/scripts/validate-catalog.mjs
      - run: node deploy/scripts/validate-gitops.mjs
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        with:
          files: deploy/docker-bake.hcl
          targets: validate
          set: "*.platform=linux/amd64"
          push: false
