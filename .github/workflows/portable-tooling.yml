name: Portable tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/**'
      - 'scripts/**'
      - 'tools/knowme-builder/**'
      - 'tools/platform-native/**'
      - 'templates/**'
      - 'skills/**'
      - 'assets/templates/**'
      - '.github/workflows/portable-tooling.yml'

permissions:
  contents: read

jobs:
  portable:
    name: Node and native Builder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install pinned compiler
        run: npm ci --prefix runtime
      - name: Compile portable runtime
        run: npm run build --prefix runtime
      - name: Exercise emitted portable tools
        run: npm test --prefix runtime
      - name: Check emitted modules are reproducible
        run: git diff --exit-code -- scripts templates/project-skills/hooks
      - name: Read native toolchain pin
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/knowme-builder
      - name: Native Builder lint
        run: cargo clippy --locked --manifest-path tools/knowme-builder/Cargo.toml --all-targets -- -D warnings
      - name: Native Builder public behaviors
        run: cargo test --locked --manifest-path tools/knowme-builder/Cargo.toml
      - name: Native platform helper lint
        run: cargo clippy --locked --manifest-path tools/platform-native/Cargo.toml --all-targets -- -D warnings

# Native runner execution is necessary evidence. This workflow is not evidence
# until it runs successfully, and does not certify generated application UIs.
