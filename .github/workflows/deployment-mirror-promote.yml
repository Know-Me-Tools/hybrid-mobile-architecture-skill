name: Mirror and promote image digests
on:
  workflow_dispatch:
    inputs:
      source:
        description: GHCR image including sha256 digest
        required: true
        type: string
      image_name:
        description: Catalog image name
        required: true
        type: string
      gitops_repository:
        description: owner/repository for live ArgoCD state
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloud-registry-production
    steps:
      - &a1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install registry copy client from the pinned runner distribution
        run: node scripts/ci-deployment.mjs install-skopeo
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate target registries
        run: node scripts/ci-deployment.mjs authenticate
      - name: Mirror exact digest
        run: node scripts/ci-deployment.mjs mirror
    env:
      SOURCE_REF: ${{ inputs.source }}
      IMAGE_NAME: ${{ inputs.image_name }}
      GCP_REGISTRY_HOST: ${{ vars.GCP_REGISTRY_HOST }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REPOSITORY: ${{ vars.GCP_REPOSITORY }}
  promote:
    needs: mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - *a1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ inputs.gitops_repository }}
          token: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
          path: gitops
      - name: Commit immutable promotion
        run: node ../scripts/ci-deployment.mjs promote
        working-directory: gitops
        env:
          SOURCE_REF: ${{ inputs.source }}
          IMAGE_NAME: ${{ inputs.image_name }}
