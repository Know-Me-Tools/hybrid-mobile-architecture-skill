name: scaffold-ci
on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - assets/templates/**
      - templates/**
      - skills/**
      - versions.toml
      - ci/**
      - .github/workflows/scaffold-ci.yml
  pull_request:
    paths:
      - scripts/**
      - assets/templates/**
      - templates/**
      - skills/**
      - versions.toml
      - ci/**
      - .github/workflows/scaffold-ci.yml
env:
  CARGO_TERM_COLOR: always
jobs:
  gates:
    name: Audit gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Doc consistency
        run: node scripts/audit.mjs doc-consistency
      - name: Generator purity
        run: node scripts/audit.mjs generator-purity
      - name: Harness skill trees in sync
        run: node scripts/sync-harness-skills.mjs --check
  scaffold:
    name: Scaffold structure + manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - gates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify scaffold output
        run: node scripts/verify-scaffold.mjs
  compile:
    name: Generated workspace compiles
    runs-on: macos-15
    timeout-minutes: 90
    needs:
      - scaffold
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read toolchain pin
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Scaffold a throwaway workspace
        run: node scripts/scaffold-rust-core.mjs "${{ runner.temp }}/scratch/rust"
      - name: cargo check
        working-directory: ${{ runner.temp }}/scratch/rust
        run: cargo check --workspace --exclude gen_ui_ffi
      - name: cargo check — per-device inference lanes
        working-directory: ${{ runner.temp }}/scratch/rust
        run: node "${{ github.workspace }}/scripts/ci-package.mjs" inference-check
      - name: cargo test
        working-directory: ${{ runner.temp }}/scratch/rust
        run: cargo test -p gen_ui_agent -p gen_ui_context -p gen_ui_client -p gen_ui_protocol
  surfaces:
    name: Generated surfaces — analyze + typecheck
    runs-on: macos-15
    timeout-minutes: 60
    needs:
      - scaffold
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read toolchain pins
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Scaffold a full hybrid project
        run: node scripts/scaffold-hybrid.mjs "${{ runner.temp }}/scratch-hybrid"
      - name: Architecture audit on the generated project
        run: node scripts/audit.mjs all "${{ runner.temp }}/scratch-hybrid"
      - name: Flutter — dependency resolution
        working-directory: ${{ runner.temp }}/scratch-hybrid/mobile
        run: flutter pub get
