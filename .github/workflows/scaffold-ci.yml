# TJ-ARCH-MOB-001 compliant
# CI for the GENERATOR. This repo is a skill package: its product is the output
# of scripts/, not a committed application.
#
# It used to test apps/knowme-poc — a 40k-LOC snapshot of a real product that
# read like generator output but was not. When the generator fell behind the
# product, every job still passed, which is how the drift went unnoticed. So the
# fixture is now generated on each run: it cannot go stale without failing.
name: scaffold-ci

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/templates/**"
      - "templates/**"
      - "versions.toml"
      - "ci/**"
      - ".github/workflows/scaffold-ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "assets/templates/**"
      - "templates/**"
      - "versions.toml"
      - "ci/**"
      - ".github/workflows/scaffold-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, no toolchain. Runs first so an obvious break fails in under a minute
  # instead of after a Rust install.
  gates:
    name: Audit gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # versions.toml is the single source of truth; these catch a doc, a
      # scaffolder, or a skill manifest drifting away from it.
      - name: Doc consistency
        run: bash scripts/audit.sh doc-consistency
      # Product vocabulary must not reach the generator. Templates are ported out
      # of a real product codebase, so this is the gate that keeps another
      # company's branding out of a stranger's repository.
      - name: Generator purity
        run: bash scripts/audit.sh generator-purity
      - name: Harness skill trees in sync
        run: bash scripts/sync-harness-skills.sh --check

  scaffold:
    name: Scaffold structure + manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gates]
    steps:
      - uses: actions/checkout@v5
      # Structural diff against ci/expected-tree.txt, placeholder substitution,
      # the JNI-path/Kotlin-bridge match, and TOML validity. No toolchain needed:
      # this checks what the generator EMITS, not whether it compiles.
      - name: Verify scaffold output
        run: bash scripts/verify-scaffold.sh

  compile:
    name: Generated workspace compiles
    runs-on: macos-15
    timeout-minutes: 90
    needs: [scaffold]
    steps:
      - uses: actions/checkout@v5
      - name: Read toolchain pin
        id: versions
        # Never hardcode a version here. A CI pin that drifts from versions.toml
        # tests a toolchain the generator does not target — the same class of bug
        # this whole workflow exists to catch.
        run: |
          source scripts/lib-versions.sh
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Scaffold a throwaway workspace
        run: |
          mkdir -p "${{ runner.temp }}/scratch"
          bash scripts/scaffold-rust-core.sh \
            "${{ runner.temp }}/scratch/rust" embedded ci-verify com.example
      # gen_ui_ffi is EXCLUDED: `mod frb_generated;` is auto-injected by
      # flutter_rust_bridge and the generated file is not committed, so that crate
      # is unbuildable before the first codegen run. Documented in its own lib.rs.
      - name: cargo check
        working-directory: ${{ runner.temp }}/scratch/rust
        run: cargo check --workspace --exclude gen_ui_ffi
      # Each per-device lane is behind a feature flag, so a lane nobody compiles
      # rots silently. Check them individually.
      - name: cargo check — per-device inference lanes
        working-directory: ${{ runner.temp }}/scratch/rust
        run: |
          cargo check -p gen_ui_inference --features local-litert-lm
          cargo check -p gen_ui_inference --features local-mlx
      - name: cargo test
        working-directory: ${{ runner.temp }}/scratch/rust
        run: cargo test -p gen_ui_agent -p gen_ui_context -p gen_ui_client -p gen_ui_protocol

  surfaces:
    name: Generated surfaces — analyze + typecheck
    runs-on: macos-15
    timeout-minutes: 60
    needs: [scaffold]
    steps:
      - uses: actions/checkout@v5
      - name: Read toolchain pins
        id: versions
        run: |
          source scripts/lib-versions.sh
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          echo "node=${NODE_VERSION%%.*}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Scaffold a full hybrid project
        run: bash scripts/scaffold-hybrid.sh "${{ runner.temp }}/scratch-hybrid" --org com.example
      - name: Architecture audit on the generated project
        run: bash scripts/audit.sh all "${{ runner.temp }}/scratch-hybrid"
      # Flutter analysis stops before codegen: build_runner needs the frb output,
      # which needs a codegen run. This proves the emitted Dart parses and its
      # dependency set resolves — the two things the scaffolder is responsible for.
      - name: Flutter — dependency resolution
        working-directory: ${{ runner.temp }}/scratch-hybrid/mobile
        run: flutter pub get
