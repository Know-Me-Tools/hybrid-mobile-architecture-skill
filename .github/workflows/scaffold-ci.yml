name: scaffold-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  package-gates:
    name: Portable package and migration gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read exact toolchain pins
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build committed TypeScript 7 runtime
        run: npm ci --prefix runtime && npm run build --prefix runtime
      - name: Verify generated runtime is committed
        run: git diff --exit-code
      - name: Runtime and portability tests
        run: npm test --prefix runtime
      - name: Builder migrations and brownfield tests
        run: cargo test --locked --manifest-path tools/knowme-builder/Cargo.toml
      - name: Builder lint
        run: cargo clippy --locked --manifest-path tools/knowme-builder/Cargo.toml --all-targets -- -D warnings
      - name: Package policy gates
        run: node scripts/audit.mjs doc-consistency && node scripts/audit.mjs generator-purity && node scripts/check-portable-runtime.mjs && node scripts/sync-harness-skills.mjs --check && node scripts/verify-scaffold.mjs

  web-runtime:
    name: Generated web build and restart proof
    runs-on: ubuntu-latest
    needs: package-gates
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read exact toolchain pins
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate runnable web application
        run: cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- new "${{ runner.temp }}/cert-web" --profile governed-web-shell --mode runnable && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- add feature "CI Notes" --path "${{ runner.temp }}/cert-web"
      - name: Verify Rust clean-architecture workspace
        working-directory: ${{ runner.temp }}/cert-web
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace && cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings && cargo check --locked --manifest-path server/Cargo.toml
      - name: Build web surface
        working-directory: ${{ runner.temp }}/cert-web/web
        run: npm ci && npm run typecheck && npm run build
      - name: Install real-browser runtime
        working-directory: ${{ runner.temp }}/cert-web/web
        run: npx playwright install --with-deps chromium
      - name: Browser to Axum to SQLite restart proof
        working-directory: ${{ runner.temp }}/cert-web/web
        env:
          EXPECTED_CAPABILITY: CI Notes
        run: npm run test:e2e
      - name: Prepare compatible brownfield application
        run: cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- new "${{ runner.temp }}/cert-brownfield" --profile governed-web-shell --mode runnable && node -e "const fs=require('node:fs');fs.renameSync(process.argv[1],process.argv[2]);fs.writeFileSync(process.argv[3],'export const consumer = true;\n')" "${{ runner.temp }}/cert-brownfield/.knowme-builder" "${{ runner.temp }}/brownfield-original-state" "${{ runner.temp }}/cert-brownfield/web/src/user-owned.ts" && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- adopt "${{ runner.temp }}/cert-brownfield" --profile governed-web-shell --apply && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- add feature "Brownfield Notes" --path "${{ runner.temp }}/cert-brownfield"
      - name: Build and execute altered brownfield application
        working-directory: ${{ runner.temp }}/cert-brownfield/web
        env:
          EXPECTED_CAPABILITY: Brownfield Notes
        run: npm ci && npm run test:e2e
      - name: Verify brownfield user bytes
        run: node -e "const fs=require('node:fs');if(fs.readFileSync(process.argv[1],'utf8')!=='export const consumer = true;\n')process.exit(1)" "${{ runner.temp }}/cert-brownfield/web/src/user-owned.ts"

  windows-native:
    name: Windows ${{ matrix.arch }} native build and execution
    needs: package-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          architecture: ${{ matrix.arch }}
      - name: Read exact toolchain pins
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
          architecture: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned native WebDriver tools
        run: node scripts/install-tauri-webdriver.mjs
      - name: Build runtime helper
        run: npm ci --prefix runtime && npm run build --prefix runtime
      - name: Verify native prerequisites
        run: cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- doctor --native-only --target ${{ matrix.target }} --json
      - name: Generate runnable Tauri application
        run: cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- new "${{ runner.temp }}/cert-native" --profile tauri-desktop --mode runnable && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- add feature "CI Notes" --path "${{ runner.temp }}/cert-native"
      - name: Verify shared native persistence
        working-directory: ${{ runner.temp }}/cert-native
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace && cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Build Tauri application
        working-directory: ${{ runner.temp }}/cert-native/desktop
        run: npm ci && npm run typecheck && npm run tauri build -- --no-bundle
      - name: Execute packaged UI and verify persistence across relaunch
        run: node scripts/verify-tauri-ui-restart.mjs "${{ runner.temp }}/cert-native/desktop/src-tauri/target/release/cert_native_desktop.exe" "${{ runner.temp }}/cert-native-runtime"
      - name: Prepare tagged alpha.3 migration fixture
        if: matrix.arch == 'x64'
        run: node -e "require('node:fs').cpSync(process.argv[1],process.argv[2],{recursive:true})" "tools/knowme-builder/tests/fixtures/upgrades/alpha3-sovereign-hybrid" "${{ runner.temp }}/cert-migrated" && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- upgrade "${{ runner.temp }}/cert-migrated" --apply --app-name output
      - name: Build and execute migrated historical desktop
        if: matrix.arch == 'x64'
        working-directory: ${{ runner.temp }}/cert-migrated/desktop
        run: npm ci && npm run typecheck && npm run tauri build -- --no-bundle
      - name: Verify migrated historical UI persistence across relaunch
        if: matrix.arch == 'x64'
        run: node scripts/verify-tauri-ui-restart.mjs "${{ runner.temp }}/cert-migrated/desktop/src-tauri/target/release/output_desktop.exe" "${{ runner.temp }}/cert-migrated-runtime"

  flutter-native:
    name: Flutter FFI, Android ARM64, and iOS simulator
    runs-on: macos-15
    needs: package-gates
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read exact toolchain pins
        id: versions
        run: node scripts/ci-versions.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy
          targets: aarch64-apple-ios-sim,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true
      - name: Generate runnable Flutter application
        run: cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- new "${{ runner.temp }}/cert-flutter" --profile flutter-mobile --mode runnable && cargo run --locked --manifest-path tools/knowme-builder/Cargo.toml -- add feature "CI Notes" --path "${{ runner.temp }}/cert-flutter"
      - name: Install exact bridge code generator
        run: dart pub global activate flutter_rust_bridge_codegen ${{ steps.versions.outputs.flutter_rust_bridge }}
      - name: Generate bridge and Riverpod outputs
        working-directory: ${{ runner.temp }}/cert-flutter/mobile
        run: flutter pub get && flutter_rust_bridge_codegen generate && flutter pub run build_runner build --delete-conflicting-outputs && node "${{ github.workspace }}/scripts/mark-generated-sources.mjs" "${{ runner.temp }}/cert-flutter"
      - name: Analyze and execute Flutter tests
        working-directory: ${{ runner.temp }}/cert-flutter/mobile
        run: flutter analyze && flutter test
      - name: Verify Rust and generated FFI crates
        working-directory: ${{ runner.temp }}/cert-flutter
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings && cargo test --locked --manifest-path rust/Cargo.toml --workspace && cargo clippy --locked --manifest-path rust/gen_ui_ffi/Cargo.toml --all-targets -- -D warnings
      - name: Build iOS simulator application
        working-directory: ${{ runner.temp }}/cert-flutter/mobile
        run: flutter build ios --simulator --no-codesign
      - name: Execute iOS FFI persistence across application relaunch
        run: node scripts/verify-flutter-ios-restart.mjs "${{ runner.temp }}/cert-flutter/mobile"
      - name: Build Android ARM64 application
        working-directory: ${{ runner.temp }}/cert-flutter/mobile
        run: flutter build apk --debug --target-platform android-arm64
      - name: Execute Android ARM64 FFI persistence across application relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          profile: pixel_7
          script: node scripts/verify-flutter-ios-restart.mjs "${{ runner.temp }}/cert-flutter/mobile" emulator-5554
